version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: core_banking_postgres
    environment:
      POSTGRES_USER: pismo_user
      POSTGRES_PASSWORD: pismo_password
      POSTGRES_DB: core_banking_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pismo_user -d core_banking_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:15-alpine
    container_name: core_banking_postgres_test
    environment:
      POSTGRES_USER: pismo_user
      POSTGRES_PASSWORD: pismo_password
      POSTGRES_DB: core_banking_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres_data: